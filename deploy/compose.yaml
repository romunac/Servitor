services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servitor
      POSTGRES_USER: servitor
      POSTGRES_PASSWORD: servitor-local-only
    ports:
      - "5432:5432"
    volumes:
      - servitor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servitor -d servitor"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - servitor-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  servitor-postgres:
  servitor-redis:
